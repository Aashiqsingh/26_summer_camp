<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <fieldset>
        <legend>User Details</legend>
    <form action="">
        <table>
            <tr>
                <td>Name</td>
                <td><input type="text" name="name" placeholder="Enter name" required></td>
            </tr>
            <tr>
                <td>surName</td>
                <td><input type="text" name="sname"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="" id=""></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="pass" id=""></td>
            </tr>
            <tr>
                <td>DOB</td>
                <!-- <td><input type="date" name="" id=""></td> -->
                <td><input type="datetime-local" name="" id=""></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    Male <input type="radio" name="Gender" value="male" id="">
                    Female <input type="radio" name="Gender" id="" value="female">
                </td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td>
                    cricket <input type="checkbox" name="hobby" value="cricket" id="">
                    football <input type="checkbox" name="hobby" value="football" id="">
                    basketball <input type="checkbox" name="hobby" value="basketball" id="">
                </td>
            </tr>
            <tr>
                <td>Mobile</td>
                <td><input type="tel" name="" id=""></td>
            </tr>
            <tr>
                <td>Age</td>
                <td><input min="5" max="12" type="number" name="" id=""></td>
            </tr>
            <tr>
                <td>Address</td>
                <td>
                    <textarea placeholder="Address...." name="" rows="5" cols="30" id=""></textarea>
                </td>
            </tr>
            <tr>
                <td>City</td>
                <td>
                    <select name="city" id="">
                        <option value="" disabled selected>Select city</option>
                        <option value="Ahmedabad">Ahemdabad</option>
                        <option value="st">Surat</option>
                        <option value="Jaipur">Jaipur</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Pune">Pune</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Attach file</td>
                <td><input type="file" name="" id=""></td>
            </tr>
            <tr>
                <td><input type="submit" value="login" name="" id=""></td>
            </tr>
        </table>
    </form>

    </fieldset>
    
</body>
</html>
